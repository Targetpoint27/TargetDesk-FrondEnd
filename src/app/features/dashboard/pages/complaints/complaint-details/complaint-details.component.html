<div class="min-h-screen bg-gray-50/30 p-6" *ngIf="complaint$ | async as rec">
  <div class="max-w-7xl mx-auto mb-6">
    <div class="flex items-center justify-between bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
      <div class="flex items-center gap-4">
        <button [routerLink]="['/dashboard/complaints']" class="p-2 hover:bg-gray-100 rounded-xl transition-colors">
          <i class="bi bi-arrow-left text-xl"></i>
        </button>
        <div>
          <h1 class="text-xl font-bold text-gray-900">{{ rec.complaint_number }}</h1>
          <p class="text-xs text-gray-500 uppercase font-black tracking-widest">Créée le {{ rec.created_at | date:'dd/MM/yyyy' }}</p>
        </div>
      </div>
      <div class="flex gap-3">
        <span [class]="'px-4 py-2 rounded-xl text-xs font-black uppercase tracking-widest ' + rec.status">
          {{ rec.status_label }}
        </span>
      </div>
    </div>
  </div>

  <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6">
    
    <div class="lg:col-span-1 space-y-6">
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
        <h2 class="text-sm font-black text-blue-600 uppercase tracking-widest mb-4">Contexte de l'appel</h2>
        <div class="space-y-4">
          <div>
            <label class="text-[10px] font-bold text-gray-400 uppercase">Objet de l'appel</label>
            <p class="text-gray-900 font-semibold">{{ rec.category_label }}</p>
          </div>
          <div>
            <label class="text-[10px] font-bold text-gray-400 uppercase">Description initiale</label>
            <p class="text-sm text-gray-700 leading-relaxed bg-gray-50 p-3 rounded-lg border border-gray-100">{{ rec.description }}</p>
          </div>
        </div>
      </div>
    </div>

    <div class="lg:col-span-2 space-y-6">
      
      <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-8">
        <h2 class="text-lg font-bold text-gray-900 mb-6 flex items-center gap-2">
          <i class="bi bi-search text-blue-600"></i> Analyse du Litige
        </h2>
        
        <form [formGroup]="complaintForm" (ngSubmit)="onSave()" class="space-y-6">
            <div>
                <label class="block text-xs font-black text-gray-500 uppercase tracking-widest mb-2">
                Cause Racine (Root Cause)
                </label>
                <textarea 
                formControlName="root_cause" 
                rows="3" 
                class="w-full text-black p-4 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all" 
                placeholder="Pourquoi ce problème est-il survenu ?">
                </textarea>
            </div>

            <div>
                <label class="block text-xs font-black text-gray-500 uppercase tracking-widest mb-2">
                Actions Menées
                </label>
                <textarea 
                formControlName="actions_taken" 
                rows="3" 
                class="w-full p-4 bg-gray-50 text-black border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all" 
                placeholder="Qu'avez-vous fait pour investiguer ?">
                </textarea>
            </div>

            <div>
                <label class="block text-xs font-black text-gray-500 uppercase tracking-widest mb-2">
                Solution Proposée
                </label>
                <textarea 
                formControlName="proposed_solution" 
                rows="3" 
                class="w-full p-4 bg-gray-50 text-black border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all" 
                placeholder="Comment comptez-vous résoudre cela ?">
                </textarea>
            </div>

            <div class="pt-4 border-t border-gray-100 flex justify-end">
                <button 
                type="submit" 
                [disabled]="complaintForm.invalid || (isLoading$ | async)"
                class="px-8 py-3 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 shadow-lg shadow-blue-100 transition-all flex items-center gap-2">
                <i class="bi bi-save"></i> 
                {{ (isLoading$ | async) ? 'Enregistrement...' : "Enregistrer l'analyse" }}
                </button>
            </div>
        </form>
      </div>

      <div class="mt-6" *ngIf="rec.status === 'en_analyse'">
        <div class="bg-white rounded-2xl shadow-xl border-t-4 border-t-emerald-500 border border-gray-100 p-8">
          <h2 class="text-lg font-bold text-gray-900 mb-6 flex items-center gap-2">
            <i class="bi bi-check2-circle text-emerald-600"></i> Résolution du Litige
          </h2>
          
          <form [formGroup]="resolutionForm" (ngSubmit)="onResolve()" class="space-y-6">
            <div class="form-group">
              <label class="block text-xs font-black text-gray-500 uppercase tracking-widest mb-2">Résumé de la Solution</label>
              <textarea 
                formControlName="resolution_summary" 
                rows="3" 
                class="w-full text-black p-4 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none transition-all"
                placeholder="Expliquez la solution finale apportée au client..."></textarea>
            </div>

            <div class="form-group">
              <label class="block text-xs font-black text-gray-500 uppercase tracking-widest mb-2">Détails du Dédommagement (Optionnel)</label>
              <textarea 
                formControlName="compensation_details" 
                rows="2" 
                class="w-full p-4 bg-gray-50 text-black border border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none transition-all"
                placeholder="Ex: Geste commercial, remboursement, etc."></textarea>
            </div>

            <div class="form-group">
              <label class="block text-xs font-black text-gray-500 uppercase tracking-widest mb-2">Niveau de Satisfaction</label>
              <select formControlName="client_satisfaction" class="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500 text-black">
                <option value="">Sélectionner un avis...</option>
                <option value="satisfait">Satisfait</option>
                <option value="partiellement_satisfait">Partiellement Satisfait</option>
                <option value="non_satisfait">Non Satisfait</option>
              </select>
            </div>

            <div class="form-group">
              <label class="block text-xs font-black text-gray-500 uppercase tracking-widest mb-2">Résumé de la Solution</label>
              <textarea formControlName="resolution_summary" rows="3" class="w-full text-black p-4 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none transition-all"></textarea>
            </div>

            <div class="pt-4 border-t border-gray-100 flex justify-end">
              <button 
                type="submit" 
                [disabled]="resolutionForm.invalid || (isLoading$ | async)"
                class="px-8 py-3 bg-emerald-600 text-white font-bold rounded-xl hover:bg-emerald-700 shadow-lg shadow-emerald-100 transition-all flex items-center gap-2">
                <i class="bi bi-check-lg"></i>
                Confirmer la Résolution
              </button>
            </div>
          </form>
        </div>
      </div>

      <div class="mt-6" *ngIf="rec.status === 'resolue'">
        <div class="bg-white rounded-2xl shadow-xl border-t-4 border-t-blue-600 border border-gray-100 p-8">
          <h2 class="text-lg font-bold text-gray-900 mb-6 flex items-center gap-2">
            <i class="bi bi-door-closed text-blue-600"></i> Clôture & Satisfaction Client
          </h2>
          
          <form [formGroup]="closureForm" (ngSubmit)="onClose()" class="space-y-6">
            <div class="form-group">
              <label class="block text-xs font-black text-gray-500 uppercase tracking-widest mb-2">Niveau de Satisfaction</label>
              <select formControlName="client_satisfaction" class="w-full text-black p-4 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">Sélectionner un avis...</option>
                <option value="satisfait">Satisfait</option>
                <option value="partiellement_satisfait">Partiellement Satisfait</option>
                <option value="non_satisfait">Non Satisfait</option>
              </select>
            </div>

            <div class="form-group">
              <label class="block text-xs font-black text-gray-500 uppercase tracking-widest mb-2">Commentaire de Clôture</label>
              <textarea 
                formControlName="closing_comment" 
                rows="3" 
                class="w-full p-4 bg-gray-50 text-black border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="Note finale sur l'échange avec le client..."></textarea>
            </div>

            <div class="pt-4 border-t border-gray-100 flex justify-end">
              <button 
                type="submit" 
                [disabled]="closureForm.invalid || (isLoading$ | async)"
                class="px-8 py-3 bg-gray-900 text-white font-bold rounded-xl hover:bg-black transition-all flex items-center gap-2">
                <i class="bi bi-archive"></i>
                Clôturer Définitivement
              </button>
            </div>
          </form>
        </div>
      </div>

    </div>
  </div>
</div>
