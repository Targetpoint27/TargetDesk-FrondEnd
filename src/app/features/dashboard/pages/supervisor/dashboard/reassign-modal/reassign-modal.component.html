<div class="p-6">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-xl font-bold text-slate-800">Réassignation d'Appel</h2>
    <button (click)="cancel.emit()" class="text-slate-400 hover:text-slate-600 transition-colors">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>

  <div class="space-y-4 mb-6">
    <p class="text-xs font-black text-slate-400 uppercase tracking-widest">Choisir l'agent cible</p>
    
    <div class="max-h-64 overflow-y-auto pr-2 space-y-2 custom-scrollbar">
      <div *ngFor="let agent of agents" 
           (click)="selectedAgentId = agent.id"
           [class.selected]="selectedAgentId === agent.id"
           class="agent-option-card">
        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center font-bold text-slate-600">
              {{ agent.name.charAt(0) }}
            </div>
            <div>
              <p class="text-sm font-bold text-slate-700">{{ agent.name }}</p>
              <p class="text-[10px] text-slate-500">{{ agent.active_calls }} appels en cours</p>
            </div>
          </div>
          <span class="px-2 py-0.5 rounded text-[10px] font-black uppercase" 
                [ngClass]="getLoadClass(agent.load_status)">
            {{ agent.load_status }}
          </span>
        </div>
      </div>
    </div>
  </div>

  <div class="mb-8">
    <label class="block text-xs font-black text-slate-400 uppercase mb-2">Motif de réassignation (Optionnel)</label>
    <textarea [(ngModel)]="reason" 
              class="w-full p-4 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-blue-500 outline-none"
              placeholder="Pourquoi changez-vous l'attribution ?"></textarea>
  </div>

  <div class="flex space-x-3">
    <button (click)="cancel.emit()" class="flex-1 py-3 font-bold text-slate-500 hover:bg-slate-50 rounded-xl transition-all">
      Annuler
    </button>
    <button [disabled]="!selectedAgentId" 
            (click)="onConfirm()"
            class="flex-1 py-3 font-bold text-white bg-blue-600 hover:bg-blue-700 disabled:opacity-50 rounded-xl shadow-lg shadow-blue-200 transition-all">
      Confirmer
    </button>
  </div>
</div>
