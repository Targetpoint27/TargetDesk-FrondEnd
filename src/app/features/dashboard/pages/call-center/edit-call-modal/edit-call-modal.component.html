<!-- Backdrop -->
<div class="drawer-backdrop" (click)="handleClose()"></div>

<!-- Slide-in Panel -->
<div class="drawer-panel" (click)="$event.stopPropagation()">

  <!-- Header -->
  <div class="drawer-header">
    <div class="drawer-header-left">
      <div class="drawer-header-icon">
        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
        </svg>
      </div>
      <div>
        <h2 class="drawer-title">Modifier l'Appel</h2>
        <p class="drawer-subtitle">{{ call.call_id }}</p>
      </div>
    </div>
    <button (click)="handleClose()" class="drawer-close-btn">
      <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <!-- Form -->
  <form [formGroup]="editForm" (ngSubmit)="handleSubmit()" class="drawer-form">

    <!-- Phone Number -->
    <div class="form-group">
      <label class="form-label">
        Numéro de téléphone
        <span class="form-required">*</span>
      </label>
      <input
        type="tel"
        formControlName="phone_number"
        class="form-input"
        [class.form-input--error]="isFieldInvalid('phone_number')"
        placeholder="Ex: 0612345678">
      <p *ngIf="isFieldInvalid('phone_number')" class="form-error">
        {{ getFieldError('phone_number') }}
      </p>
    </div>

    <!-- Caller Name -->
    <div class="form-group">
      <label class="form-label">Nom de l'appelant</label>
      <input
        type="text"
        formControlName="caller_name"
        class="form-input"
        placeholder="Ex: Jean Dupont">
    </div>

    <!-- Department -->
    <div class="form-group">
      <label class="form-label">
        Département
        <span class="form-required">*</span>
      </label>
      <select
        formControlName="department_id"
        class="form-select"
        [class.form-input--error]="isFieldInvalid('department_id')">
        <option value="" disabled>Sélectionner un département</option>
        <option *ngFor="let dept of departments" [value]="dept.id">
          {{ dept.name }} ({{ dept.code }})
        </option>
      </select>
      <p *ngIf="isFieldInvalid('department_id')" class="form-error">
        {{ getFieldError('department_id') }}
      </p>
    </div>

    <!-- Urgency -->
    <div class="form-group">
      <label class="form-label">
        Urgence
        <span class="form-required">*</span>
      </label>
      <select
        formControlName="urgency"
        class="form-select"
        [class.form-input--error]="isFieldInvalid('urgency')">
        <option value="" disabled>Sélectionner le niveau d'urgence</option>
        <option *ngFor="let option of urgencyOptions" [value]="option.value">
          {{ option.label }}
        </option>
      </select>
      <p *ngIf="isFieldInvalid('urgency')" class="form-error">
        {{ getFieldError('urgency') }}
      </p>
    </div>

    <!-- Object -->
    <div class="form-group">
      <label class="form-label">
        Objet
        <span class="form-required">*</span>
      </label>
      <input
        type="text"
        formControlName="object"
        class="form-input"
        [class.form-input--error]="isFieldInvalid('object')"
        placeholder="Ex: Problème technique">
      <p *ngIf="isFieldInvalid('object')" class="form-error">
        {{ getFieldError('object') }}
      </p>
    </div>

    <!-- Summary -->
    <div class="form-group">
      <label class="form-label">
        Résumé
        <span class="form-required">*</span>
      </label>
      <textarea
        formControlName="summary"
        rows="5"
        class="form-textarea"
        [class.form-input--error]="isFieldInvalid('summary')"
        placeholder="Décrivez les détails de l'appel..."></textarea>
      <p *ngIf="isFieldInvalid('summary')" class="form-error">
        {{ getFieldError('summary') }}
      </p>
    </div>

    <!-- Footer -->
    <div class="drawer-footer">
      <button type="button" (click)="handleClose()" class="btn-cancel">Annuler</button>
      <button type="submit" [disabled]="editForm.invalid || isSubmitting" class="btn-submit">
        {{ isSubmitting ? 'Enregistrement...' : 'Enregistrer' }}
      </button>
    </div>

  </form>
</div>
