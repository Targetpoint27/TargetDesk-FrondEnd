<!-- Modal Overlay -->
<div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-end" (click)="handleClose()">
  
  <!-- Modal Panel -->
  <div class="bg-white h-full w-full max-w-2xl shadow-2xl overflow-y-auto" (click)="$event.stopPropagation()">
    
    <!-- Header -->
    <div class="sticky top-0 bg-gradient-to-r from-blue-600 to-indigo-600 px-6 py-5 z-10">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-white/10 backdrop-blur-sm rounded-xl flex items-center justify-center">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
            </svg>
          </div>
          <div>
            <h2 class="text-xl font-bold text-white">Modifier l'Appel</h2>
            <p class="text-blue-100 text-sm">{{ call.call_id }}</p>
          </div>
        </div>
        
        <button 
          (click)="handleClose()"
          class="w-10 h-10 flex items-center justify-center rounded-xl bg-white/10 hover:bg-white/20 transition-colors">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Form Content -->
    <form [formGroup]="editForm" (ngSubmit)="handleSubmit()" class="p-6 space-y-6">
      
      <!-- Phone Number -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">
          Numéro de téléphone
          <span class="text-red-500">*</span>
        </label>
        <input
          type="tel"
          formControlName="phone_number"
          [class.border-red-300]="isFieldInvalid('phone_number')"
          class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all bg-white text-gray-900"
          placeholder="Ex: 0612345678">
        <p *ngIf="isFieldInvalid('phone_number')" class="mt-1 text-sm text-red-600">
          {{ getFieldError('phone_number') }}
        </p>
      </div>

      <!-- Caller Name -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">
          Nom de l'appelant
        </label>
        <input
          type="text"
          formControlName="caller_name"
          class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all bg-white text-gray-900"
          placeholder="Ex: Jean Dupont">
      </div>

      <!-- Department -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">
          Département
          <span class="text-red-500">*</span>
        </label>
        <select
          formControlName="department_id"
          [class.border-red-300]="isFieldInvalid('department_id')"
          class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all bg-white text-gray-900">
          <option value="" disabled>Sélectionner un département</option>
          <option *ngFor="let dept of departments" [value]="dept.id">
            {{ dept.name }} ({{ dept.code }})
          </option>
        </select>
        <p *ngIf="isFieldInvalid('department_id')" class="mt-1 text-sm text-red-600">
          {{ getFieldError('department_id') }}
        </p>
      </div>

      <!-- Urgency -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">
          Urgence
          <span class="text-red-500">*</span>
        </label>
        <select
          formControlName="urgency"
          [class.border-red-300]="isFieldInvalid('urgency')"
          class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all bg-white text-gray-900">
          <option value="" disabled>Sélectionner le niveau d'urgence</option>
          <option *ngFor="let option of urgencyOptions" [value]="option.value">
            {{ option.label }}
          </option>
        </select>
        <p *ngIf="isFieldInvalid('urgency')" class="mt-1 text-sm text-red-600">
          {{ getFieldError('urgency') }}
        </p>
      </div>

      <!-- Object -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">
          Objet
          <span class="text-red-500">*</span>
        </label>
        <input
          type="text"
          formControlName="object"
          [class.border-red-300]="isFieldInvalid('object')"
          class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all bg-white text-gray-900"
          placeholder="Ex: Problème technique">
        <p *ngIf="isFieldInvalid('object')" class="mt-1 text-sm text-red-600">
          {{ getFieldError('object') }}
        </p>
      </div>

      <!-- Summary -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-2">
          Résumé
          <span class="text-red-500">*</span>
        </label>
        <textarea
          formControlName="summary"
          rows="5"
          [class.border-red-300]="isFieldInvalid('summary')"
          class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all resize-none bg-white text-gray-900"
          placeholder="Décrivez les détails de l'appel..."></textarea>
        <p *ngIf="isFieldInvalid('summary')" class="mt-1 text-sm text-red-600">
          {{ getFieldError('summary') }}
        </p>
      </div>

      <!-- Action Buttons -->
      <div class="flex gap-3 pt-4 border-t border-gray-200">
        <button
          type="button"
          (click)="handleClose()"
          class="flex-1 px-6 py-3 border border-gray-300 text-gray-700 font-semibold rounded-xl hover:bg-gray-50 transition-colors">
          Annuler
        </button>
        <button
          type="submit"
          [disabled]="editForm.invalid || isSubmitting"
          class="flex-1 px-6 py-3 bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-semibold rounded-xl hover:from-blue-700 hover:to-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all shadow-lg">
          {{ isSubmitting ? 'Enregistrement...' : 'Enregistrer' }}
        </button>
      </div>
    </form>
  </div>
</div>
