<!-- Backdrop -->
<div class="modal-backdrop" (click)="handleClose()"></div>

<!-- Panel -->
<div class="modal-panel" (click)="$event.stopPropagation()">

  <!-- Header -->
  <div class="modal-header">
    <div class="modal-header-left">
      <div class="modal-header-icon">
        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      </div>
      <div>
        <h2 class="modal-title">Clôturer l'Appel</h2>
        <p class="modal-subtitle">{{ call.call_id }}</p>
      </div>
    </div>
    <button (click)="handleClose()" class="modal-close-btn">
      <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <!-- Warning Banner -->
  <div class="warning-banner">
    <svg width="16" height="16" fill="currentColor" viewBox="0 0 20 20" class="warning-icon">
      <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
    </svg>
    <div>
      <p class="warning-title">Action irréversible</p>
      <p class="warning-text">L'appel sera marqué comme clôturé et ne pourra plus être modifié.</p>
    </div>
  </div>

  <!-- Form -->
  <form [formGroup]="closeForm" (ngSubmit)="handleSubmit()" class="modal-body">

    <!-- Call summary read-only -->
    <div class="summary-block">
      <p class="summary-label">Résumé de l'appel</p>
      <p class="summary-text">{{ call.summary }}</p>
    </div>

    <!-- Resolution summary -->
    <div class="form-group">
      <label class="form-label">
        Résumé de la résolution
        <span class="form-required">*</span>
      </label>
      <textarea
        formControlName="resolution_summary"
        rows="5"
        class="form-textarea"
        [class.form-input--error]="isFieldInvalid('resolution_summary')"
        placeholder="Décrivez comment l'appel a été résolu, les actions prises, et tout détail important..."></textarea>
      <div class="form-hint-row">
        <p *ngIf="isFieldInvalid('resolution_summary')" class="form-error">
          {{ getFieldError('resolution_summary') }}
        </p>
        <p class="form-hint">Minimum 10 caractères</p>
      </div>
    </div>

    <!-- Final result -->
    <div class="form-group">
      <label class="form-label">
        Résultat final
        <span class="form-required">*</span>
      </label>
      <div class="result-grid">

        <label class="result-option"
               [class.result-option--selected]="closeForm.get('final_result')?.value === 'resolu_satisfait'">
          <input type="radio" formControlName="final_result" value="resolu_satisfait" class="result-radio-input">
          <span class="result-icon result-icon--green">
            <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
          </span>
          <span class="result-label">{{ finalResultOptions[0].label }}</span>
          <svg *ngIf="closeForm.get('final_result')?.value === 'resolu_satisfait'"
               class="result-check" width="15" height="15" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
          </svg>
        </label>

        <label class="result-option"
               [class.result-option--selected]="closeForm.get('final_result')?.value === 'resolu_insatisfait'">
          <input type="radio" formControlName="final_result" value="resolu_insatisfait" class="result-radio-input">
          <span class="result-icon result-icon--amber">
            <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
          </span>
          <span class="result-label">{{ finalResultOptions[1].label }}</span>
          <svg *ngIf="closeForm.get('final_result')?.value === 'resolu_insatisfait'"
               class="result-check" width="15" height="15" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
          </svg>
        </label>

        <label class="result-option"
               [class.result-option--selected]="closeForm.get('final_result')?.value === 'transfere'">
          <input type="radio" formControlName="final_result" value="transfere" class="result-radio-input">
          <span class="result-icon result-icon--blue">
            <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/>
            </svg>
          </span>
          <span class="result-label">{{ finalResultOptions[2].label }}</span>
          <svg *ngIf="closeForm.get('final_result')?.value === 'transfere'"
               class="result-check" width="15" height="15" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
          </svg>
        </label>

        <label class="result-option"
               [class.result-option--selected]="closeForm.get('final_result')?.value === 'non_resolu'">
          <input type="radio" formControlName="final_result" value="non_resolu" class="result-radio-input">
          <span class="result-icon result-icon--red">
            <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
          </span>
          <span class="result-label">{{ finalResultOptions[3].label }}</span>
          <svg *ngIf="closeForm.get('final_result')?.value === 'non_resolu'"
               class="result-check" width="15" height="15" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
          </svg>
        </label>

      </div>
      <p *ngIf="isFieldInvalid('final_result')" class="form-error">
        {{ getFieldError('final_result') }}
      </p>
    </div>

  </form>

  <!-- Footer -->
  <div class="modal-footer">
    <button type="button" (click)="handleClose()" class="btn-cancel">Annuler</button>
    <button
      type="button"
      (click)="handleSubmit()"
      [disabled]="closeForm.invalid || isSubmitting"
      class="btn-submit btn-submit--green">
      {{ isSubmitting ? 'Clôture en cours...' : "Clôturer l'appel" }}
    </button>
  </div>

</div>
