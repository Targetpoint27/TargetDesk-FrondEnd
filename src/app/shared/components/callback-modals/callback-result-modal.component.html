<div class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
  <div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden border border-gray-100 animate-slide-up">
    
    <div class="px-8 py-6 bg-gradient-to-r from-blue-600 to-indigo-600 flex items-center justify-between">
      <h3 class="text-xl font-black text-white uppercase tracking-wider">Résultat du Rappel</h3>
      <button (click)="handleClose()" class="text-white/80 hover:text-white transition-colors">
        <i class="bi bi-x-lg text-xl"></i>
      </button>
    </div>

    <form [formGroup]="resultForm" (ngSubmit)="handleSubmit()" class="p-8 space-y-6">
      
      <div>
        <label class="text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-3 block">Issue de l'appel</label>
        <div class="grid grid-cols-1 gap-3">
          <div *ngFor="let res of results" 
               (click)="resultForm.get('call_result')?.setValue(res.value)"
               [class.border-blue-500]="resultForm.get('call_result')?.value === res.value"
               [class.bg-blue-50]="resultForm.get('call_result')?.value === res.value"
               class="p-4 border-2 border-gray-100 rounded-2xl cursor-pointer hover:border-blue-200 transition-all flex items-center justify-between group">
            <span class="font-bold text-gray-700" [class.text-blue-700]="resultForm.get('call_result')?.value === res.value">
              {{ res.label }}
            </span>
            <i class="bi bi-check-circle-fill text-blue-500 opacity-0 group-hover:opacity-10" 
               [class.opacity-100]="resultForm.get('call_result')?.value === res.value"></i>
          </div>
        </div>
      </div>

      <div>
        <label class="text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-2 block">Notes de l'échange</label>
        <textarea formControlName="summary" rows="3" 
                  class="w-full p-4 bg-gray-50 border-none rounded-2xl focus:ring-2 focus:ring-blue-500/20 text-gray-900 text-sm"
                  placeholder="Qu'a dit le client ?"></textarea>
      </div>

      <div *ngIf="resultForm.get('call_result')?.value && resultForm.get('call_result')?.value !== 'contacte'" 
           class="p-6 bg-amber-50 rounded-2xl border border-amber-100 space-y-4 animate-fade-in">
        <p class="text-xs font-bold text-amber-800 flex items-center gap-2">
          <i class="bi bi-calendar-event"></i> REPROGRAMMER LE RAPPEL
        </p>
        <div class="grid grid-cols-2 gap-4">
          <input type="date" formControlName="reschedule_date" class="bg-white p-3 rounded-xl border-none text-xs font-bold">
          <input type="time" formControlName="reschedule_time" class="bg-white p-3 rounded-xl border-none text-xs font-bold">
        </div>
      </div>

      <div class="flex gap-4 pt-4">
        <button type="button" (click)="handleClose()" 
                class="flex-1 py-4 text-gray-500 font-black text-xs uppercase tracking-widest hover:bg-gray-50 rounded-2xl transition-all">
          Annuler
        </button>
        <button type="submit" [disabled]="resultForm.invalid"
                class="flex-1 py-4 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-2xl font-black text-xs uppercase tracking-widest shadow-xl shadow-blue-200 hover:-translate-y-1 disabled:opacity-50 disabled:transform-none transition-all">
          Enregistrer
        </button>
      </div>
    </form>
  </div>
</div>
