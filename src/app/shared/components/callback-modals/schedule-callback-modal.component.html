<div class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
  <div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden border border-gray-100 animate-slide-up">
    
    <div class="px-8 py-6 bg-gradient-to-r from-indigo-600 to-blue-600 flex items-center justify-between">
      <h3 class="text-xl font-black text-white uppercase tracking-wider">Programmer un Rappel</h3>
      <button (click)="handleClose()" class="text-white/80 hover:text-white transition-colors">
        <i class="bi bi-x-lg text-xl"></i>
      </button>
    </div>

    <form [formGroup]="scheduleForm" (ngSubmit)="handleSubmit()" class="p-8 space-y-6">
      
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-2 block">Date du rappel</label>
          <input type="date" formControlName="date" 
                 class="w-full p-4 bg-gray-50 border-none rounded-2xl focus:ring-2 focus:ring-indigo-500/20 text-gray-900 text-sm font-bold">
        </div>
        <div>
          <label class="text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-2 block">Heure</label>
          <input type="time" formControlName="time" 
                 class="w-full p-4 bg-gray-50 border-none rounded-2xl focus:ring-2 focus:ring-indigo-500/20 text-gray-900 text-sm font-bold">
        </div>
      </div>

      <div>
        <label class="text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-2 block">Motif du rappel</label>
        <select formControlName="reason" 
                class="w-full p-4 bg-gray-50 border-none rounded-2xl focus:ring-2 focus:ring-indigo-500/20 text-gray-900 text-sm font-bold appearance-none">
          <option value="">Sélectionner un motif...</option>
          <option value="Client indisponible">Client indisponible</option>
          <option value="Besoin d'infos techniques">Besoin d'infos techniques</option>
          <option value="Suivi de devis">Suivi de devis</option>
          <option value="Autre">Autre</option>
        </select>
      </div>

      <div>
        <label class="text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-2 block">Instructions (Optionnel)</label>
        <textarea formControlName="notes" rows="3" 
                  class="w-full p-4 bg-gray-50 border-none rounded-2xl focus:ring-2 focus:ring-indigo-500/20 text-gray-900 text-sm"
                  placeholder="Notes pour l'agent qui rappellera..."></textarea>
      </div>

      <div class="flex gap-4 pt-4">
        <button type="button" (click)="handleClose()" 
                class="flex-1 py-4 text-gray-500 font-black text-xs uppercase tracking-widest hover:bg-gray-50 rounded-2xl transition-all">
          Annuler
        </button>
        <button type="submit" [disabled]="scheduleForm.invalid"
                class="flex-1 py-4 bg-gradient-to-r from-indigo-600 to-blue-600 text-white rounded-2xl font-black text-xs uppercase tracking-widest shadow-xl shadow-indigo-100 hover:-translate-y-1 disabled:opacity-50 disabled:transform-none transition-all">
          PLANIFIER
        </button>
      </div>
    </form>
  </div>
</div>
