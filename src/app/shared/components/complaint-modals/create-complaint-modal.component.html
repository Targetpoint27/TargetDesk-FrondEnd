<div class="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-gray-900/60 backdrop-blur-sm">
  <div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden border border-white/20 animate-in fade-in zoom-in duration-200">
    
    <div class="px-6 py-5 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
      <div>
        <h3 class="text-xl font-bold text-gray-900">Nouvelle Réclamation</h3>
        <p class="text-xs text-gray-500 mt-0.5">Transformer l'appel #{{ callId }} en dossier litige</p>
      </div>
      <button (click)="close.emit()" class="text-gray-400 hover:text-gray-600 transition-colors">
        <i class="bi bi-x-lg text-lg"></i>
      </button>
    </div>

    <form [formGroup]="complaintForm" (ngSubmit)="onSubmit()" class="p-6 space-y-5">
      
      <div class="grid grid-cols-2 gap-4">
        <div class="space-y-1.5">
          <label class="text-[10px] text-black uppercase tracking-widest text-gray-400 ml-1">Catégorie</label>
          <select formControlName="category" class="w-full px-4 py-3 bg-gray-50 border text-black border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 transition-all text-sm font-medium">
            <option value="" disabled>Sélectionner...</option>
            <option *ngFor="let cat of categories" class="text-black" [value]="cat.value">{{ cat.label }}</option>
          </select>
        </div>

        <div class="space-y-1.5">
          <label class="text-[10px] text-black uppercase tracking-widest text-gray-400 ml-1">Gravité (SLA)</label>
          <select formControlName="severity" class="w-full px-4 py-3 bg-gray-50 border text-black border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 transition-all text-sm font-medium">
            <option value="" class="text-black" disabled>Priorité...</option>
            <option *ngFor="let sev of severities" class="text-black" [value]="sev.value">{{ sev.label }}</option>
          </select>
        </div>
      </div>

      <div class="space-y-1.5">
        <label class="text-[10px] font-black font-medium uppercase tracking-widest text-gray-400 ml-1">Détails de l'incident</label>
        <textarea 
          formControlName="description" 
          rows="4" 
          placeholder="Décrivez précisément le motif de la réclamation..."
          class="w-full px-4 py-3 bg-gray-50 text-black border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 transition-all text-sm font-medium resize-none">
        </textarea>
      </div>

      <div class="flex gap-3 pt-2">
        <button type="button" (click)="close.emit()" class="flex-1 px-6 py-3 border border-gray-200 text-gray-600 font-bold rounded-xl hover:bg-gray-50 transition-all text-sm">
          Annuler
        </button>
        <button 
          type="submit" 
          [disabled]="complaintForm.invalid"
          class="flex-[2] px-6 py-3 bg-blue-600 hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed text-white font-black uppercase tracking-widest rounded-xl shadow-lg shadow-blue-100 transition-all text-sm">
          Créer la réclamation
        </button>
      </div>
    </form>
  </div>
</div>
